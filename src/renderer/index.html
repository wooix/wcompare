<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'" />
<link rel="stylesheet" href="./app.css" />
<link rel="stylesheet" href="./pdf_viewer.css" />
<style>
  html, body { margin: 0; height: 100%; background:#1e1e1e; }
  /* 컨트롤이 많아 1280px 창에서는 가로가 빠듯하다. 줄바꿈을 막지 않으면 버튼 라벨이 한 글자씩
     세로로 접혀 읽을 수 없게 되므로, 접히는 대신 툴바가 가로로 스크롤되게 한다. */
  #toolbar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: #1e1e1e; color: #ddd; font: 13px sans-serif; overflow-x: auto; overflow-y: hidden; }
  #toolbar::-webkit-scrollbar { height: 0; }
  #toolbar > *, #pdf-controls > *, #diff-controls > * { flex: 0 0 auto; }
  #toolbar button, #toolbar span { white-space: nowrap; }
  #toolbar button { background: #333; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
  #toolbar button:hover { background: #444; }
  #toolbar button:disabled { opacity: 0.4; cursor: default; background: #333; }
  /* 토글이 ON일 때 버튼 강조 (Dict/Fit/Sync/Night). Switch는 액션이라 ON 개념이 없어 제외. */
  #toolbar button.on { background:#0a84ff; border-color:#0a84ff; color:#fff; }
  #toolbar button.on:hover { background:#3d9bff; }
  #toolbar input { background:#222; color:#ddd; border:1px solid #555; border-radius:4px; }
  #diff-controls, #pdf-controls { display:flex; align-items:center; gap:6px; color:#bbb; }
  #pdf-find-count { min-width:104px; font:11px monospace; color:#9cdcfe; }
  #pdf-find-count.miss { color:#f48771; }
  #diff-wrap, #pdfview { height: calc(100% - 36px - 22px); }
  #diff-wrap { display:flex; }
  #editor { flex:1; min-width:0; height:100%; }
  #pdfview { display:none; }
  /* #pdfview는 [두 pane을 감싼 .pdf-panes] + [요약 패널 .pdf-summary] 2열이다.
     요약 패널을 .pdf-pane의 형제로 바로 넣지 않는 이유: 아래 `.pdf-pane:last-child`가
     오른쪽 pane을 가려내는 선택자라, 세 번째 형제가 생기면 그 판별이 통째로 어긋난다. */
  .pdf-panes { flex:1; display:flex; min-width:0; }
  .pdf-pane { flex:1; position:relative; min-width:0; border-right:1px solid #333; display:flex; }
  .pdf-pane:last-child { border-right:none; }

  /* 보기 형태 3종 — 어떤 열을 보여줄지만 CSS로 끊는다. 문서 로드 상태는 건드리지 않으므로
     형태를 오가도 열려 있던 PDF·마커·스크롤 위치가 그대로 유지된다.
     숨긴 pane은 폭이 0이라 비율 동기·page-width 계산에서 빼야 한다 → dualView.setPaneVisible 참고. */
  #pdfview.layout-compare .pdf-summary { display:none; }
  #pdfview.layout-summary .pdf-pane[data-side=right] { display:none; }
  #pdf-layout { display:inline-flex; }
  #pdf-layout button { border-radius:0; }
  #pdf-layout button:first-child { border-radius:4px 0 0 4px; }
  #pdf-layout button:last-child { border-radius:0 4px 4px 0; }
  #pdf-layout button + button { border-left:none; }

  /* Markdown TOC 드로어 — #diff-wrap의 좌/우 flex 자식. DOM 순서(left, editor, right)로
     오른쪽 드로어가 창의 오른쪽 끝에 온다. 표시/숨김은 .show 클래스로 제어.
     Monaco는 automaticLayout:true라 드로어 폭 변화에 스스로 재배치된다. */
  .md-toc { flex:0 0 200px; display:none; overflow:auto; background:#242424; color:#ccc;
    font:12px sans-serif; padding:4px; }
  .md-toc.show { display:block; }
  #md-toc-left { border-right:1px solid #333; }
  #md-toc-right { border-left:1px solid #333; }
  .pdf-viewer-host { flex:1; position:relative; min-width:0; }
  .pdf-container { position:absolute; inset:0; overflow:auto; background:#2a2a2a; }

  /* 목차(TOC) 드로어 — 뷰어를 겹치지 않고 flex 2열로 밀어낸다(겹치면 page-width 왼쪽이 가려짐).
     열고 닫을 때 dualView가 applyFit으로 폭을 재계산한다. */
  .pdf-outline { flex:0 0 200px; display:none; overflow:auto; background:#242424;
    border-right:1px solid #333; color:#ccc; font:12px sans-serif; padding:4px; }
  .pdf-pane.outline-open .pdf-outline { display:block; }
  /* 오른쪽 pane에서는 목차 드로어를 뷰어 오른쪽(창의 오른쪽 끝)에 붙인다.
     flex 자식 기본 order 0 → outline만 order:1이면 viewer-host 뒤로 밀린다.
     .pdf-close/.pdf-busy는 absolute라 order 영향을 받지 않는다. */
  .pdf-pane:last-child .pdf-outline { order:1; border-right:none; border-left:1px solid #333; }
  .toc-item { display:flex; align-items:center; gap:2px; padding:2px 4px; border-radius:3px;
    cursor:pointer; white-space:nowrap; }
  .toc-item:hover { background:#333; }
  .toc-item.disabled { color:#666; cursor:default; }
  .toc-title { overflow:hidden; text-overflow:ellipsis; }
  .toc-toggle { flex:0 0 12px; color:#888; text-align:center; }
  .toc-kids { margin-left:12px; }
  .toc-kids.collapsed { display:none; }
  .toc-empty { color:#666; padding:6px 4px; }

  /* PDF 야간 모드 — 페이지 canvas만 반전한다. 마커/펄스는 canvas의 형제 레이어라 원색 유지. */
  #pdfview.night .pdf-container { background:#161616;
    /* 반전된 어두운 캔버스 위 검색 하이라이트 대비 보정 (pdf.js CSS 변수) */
    --highlight-bg-color: rgba(64, 200, 255, 0.45);
    --highlight-selected-bg-color: rgba(255, 170, 0, 0.6); }
  #pdfview.night .pdfViewer .page canvas { filter: invert(0.9) hue-rotate(180deg); }
  /* multiply 형광펜은 어두운 캔버스에서 안 보인다 → 야간에는 screen으로 보정 */
  #pdfview.night .wc-mark-highlight { mix-blend-mode: screen; }

  /* 미러 점프 도착 지점 펄스 (1.5초 일회성) */
  .wc-pulse { position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
    background:#9cdcfe; pointer-events:none; z-index:4; animation: wc-pulse 1.5s ease-out forwards; }
  @keyframes wc-pulse {
    0% { box-shadow:0 0 0 0 rgba(156,220,254,.85); opacity:.95; }
    100% { box-shadow:0 0 0 44px rgba(156,220,254,0); opacity:0; } }
  /* 마커(형광펜/밑줄). 페이지 div의 마지막 자식으로 붙고, 좌표는 % 라 줌/리사이즈를 CSS가 따라간다.
     pointer-events:none 이라 텍스트 선택·링크 클릭을 가로막지 않는다. */
  .wc-marker-layer { position:absolute; inset:0; pointer-events:none; z-index:3; }
  .wc-mark { position:absolute; }
  .wc-mark-highlight { mix-blend-mode:multiply; border-radius:2px; } /* 글자가 비쳐 보이게 */
  .wc-mark-underline { box-shadow: inset 0 -2px 0 currentColor; }

  /* pane 우상단 닫기 버튼 — 문서가 로드된 pane에만 보인다 */
  .pdf-close { display:none; position:absolute; top:6px; right:14px; z-index:4;
    width:22px; height:22px; padding:0; line-height:1; border-radius:50%;
    background:#333c; color:#bbb; border:1px solid #555; cursor:pointer; font:12px sans-serif; }
  .pdf-pane.loaded .pdf-close { display:block; }
  .pdf-close:hover { background:#a33; color:#fff; }

  /* 오래 걸리는 작업(번역)을 해당 pane 위에 겹쳐 표시 */
  .pdf-busy { position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; background:#2a2a2ae6;
    color:#ddd; font:13px sans-serif; text-align:center; padding:16px; }
  .pdf-busy-spin { width:26px; height:26px; border:3px solid #555; border-top-color:#9cdcfe;
    border-radius:50%; animation:pdf-spin 0.9s linear infinite; }
  @keyframes pdf-spin { to { transform:rotate(360deg); } }
  .pdf-busy-title { font-size:14px; color:#fff; }
  /* 번역은 "n / N 페이지"처럼 짧지만 URL 다운로드는 긴 주소가 들어온다 → 넘치지 않게 접는다. */
  .pdf-busy-sub { color:#9cdcfe; font:12px monospace; max-width:90%; word-break:break-all; }
  .pdf-busy-bar { width:min(260px, 70%); height:4px; background:#444; border-radius:2px; overflow:hidden; }
  .pdf-busy-bar > i { display:block; height:100%; background:#9cdcfe; width:0; transition:width .3s; }
  .pdf-busy-hint { color:#888; font-size:11px; }
  /* 빈 pane의 "URL로 PDF 열기" — 문서가 로드되면 CSS만으로 사라진다(.loaded는 dualView가 붙인다).
     컨테이너는 pointer-events:none 이라 빈 영역의 드래그&드롭을 가로막지 않고,
     실제로 조작할 입력 행만 pointer-events를 되살린다. */
  .pdf-url { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; padding:16px;
    color:#bbb; font:13px sans-serif; text-align:center; pointer-events:none; }
  .pdf-pane.loaded .pdf-url { display:none; }
  .pdf-url-title { color:#999; }
  .pdf-url-row { display:flex; gap:6px; pointer-events:auto; }
  .pdf-url-input { width:min(380px, 46vw); background:#222; color:#ddd; border:1px solid #555;
    border-radius:4px; padding:5px 8px; font:13px sans-serif; }
  .pdf-url-input:focus { outline:none; border-color:#0a84ff; }
  .pdf-url-go { background:#333; color:#ddd; border:1px solid #555; border-radius:4px;
    padding:5px 12px; cursor:pointer; font:13px sans-serif; }
  .pdf-url-go:hover { background:#444; }
  .pdf-url-input:disabled, .pdf-url-go:disabled { opacity:0.4; cursor:default; }
  .pdf-url-msg { color:#f48771; font-size:11px; max-width:90%; min-height:14px; word-break:break-word; }
  .pdf-url-hint { color:#666; font-size:11px; }
  /* ===== 논문 요약 패널 (세 번째 열) =====
     빈 상태(.sum-empty)·진행(.sum-busy)은 패널 위에 겹치는 오버레이라 .pdf-summary가 기준 박스가 된다.
     주의: .sum-empty/.sum-busy/.sum-err는 JS가 inline display를 직접 세운다(표시 여부는 JS 소관) →
     여기서는 display를 쓰지 않고 정렬만 잡는다. 그렇지 않으면 CSS 선언이 조용히 무시된다. */
  .pdf-summary { position:relative; flex:0 0 clamp(300px, 30%, 560px); min-width:0;
    display:flex; flex-direction:column; border-left:1px solid #333;
    background:#232323; color:#ddd; font:13px sans-serif; }
  .sum-tabs { display:flex; align-items:center; gap:4px; padding:6px; border-bottom:1px solid #333; }
  .sum-tab { background:#2c2c2c; color:#bbb; border:1px solid #484848; border-radius:4px;
    padding:3px 10px; cursor:pointer; font:12px sans-serif; }
  .sum-tab:hover { background:#383838; }
  .sum-tab.on { background:#0a84ff; border-color:#0a84ff; color:#fff; } /* 툴바 토글과 같은 강조 관용구 */
  .sum-regen { margin-left:auto; background:#333; color:#bbb; border:1px solid #555;
    border-radius:4px; padding:3px 8px; cursor:pointer; font:11px sans-serif; }
  .sum-regen:hover { background:#444; }
  .sum-regen:disabled, .sum-tab:disabled { opacity:0.4; cursor:default; }
  .sum-body { flex:1; min-height:0; overflow:auto; padding:10px 12px; }
  /* 필수: 흐름도는 pane이 실제 폭을 가질 때만 렌더된다(mermaid가 폭을 재야 한다) →
     활성 pane은 반드시 display:block 이어야 하고, 비활성은 display:none 이어야 한다. */
  .sum-pane { display:none; }
  .sum-pane.on { display:block; }
  .sum-pane[data-kind=flow] svg { max-width:100%; height:auto; }
  .sum-err { color:#f48771; font-size:12px; margin:8px 0; white-space:pre-wrap; word-break:break-word; }
  .sum-code { background:#1c1c1c; border:1px solid #444; border-radius:4px; padding:8px;
    color:#bbb; font:11px monospace; white-space:pre-wrap; word-break:break-all; max-height:40vh; overflow:auto; }

  .sum-empty { position:absolute; inset:0; z-index:2; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; padding:16px; text-align:center; }
  .sum-empty-title { color:#999; }
  .sum-empty-go { background:#333; color:#ddd; border:1px solid #555; border-radius:4px;
    padding:6px 14px; cursor:pointer; font:13px sans-serif; }
  .sum-empty-go:hover { background:#444; }
  .sum-empty-go:disabled { opacity:0.4; cursor:default; }
  .sum-empty-hint { color:#666; font-size:11px; max-width:90%; }

  /* 진행 오버레이 — pdf-busy와 같은 모양새로 맞춘다(같은 종류의 기다림이라 같아 보여야 한다) */
  .sum-busy { position:absolute; inset:0; z-index:3; flex-direction:column;
    align-items:center; justify-content:center; gap:8px; background:#232323e6; padding:16px; text-align:center; }
  .sum-busy-spin { width:26px; height:26px; border:3px solid #555; border-top-color:#9cdcfe;
    border-radius:50%; animation:pdf-spin 0.9s linear infinite; }
  .sum-busy-title { font-size:14px; color:#fff; }
  .sum-busy-sub { color:#9cdcfe; font:12px monospace; }
  .sum-busy-bar { width:min(220px, 70%); height:4px; background:#444; border-radius:2px; overflow:hidden; }
  .sum-busy-bar > i { display:block; height:100%; background:#9cdcfe; width:0; transition:width .3s; }
  .sum-busy-hint { color:#888; font-size:11px; }

  /* 마크다운 렌더 결과(markdownLite). LLM 출력이라 innerHTML 없이 DOM으로만 만들어진다. */
  .md-h1, .md-h2, .md-h3, .md-h4, .md-h5, .md-h6 { color:#fff; margin:14px 0 6px; line-height:1.35; }
  .md-h1 { font-size:17px; } .md-h2 { font-size:15px; } .md-h3 { font-size:14px; }
  .md-h4, .md-h5, .md-h6 { font-size:13px; color:#ddd; }
  .sum-pane > .md-h1:first-child, .sum-pane > .md-h2:first-child { margin-top:0; }
  .md-p { margin:6px 0; line-height:1.65; color:#ddd; }
  .md-ul, .md-ol { margin:6px 0; padding-left:20px; }
  .md-li { margin:3px 0; line-height:1.6; }
  .md-quote { margin:8px 0; padding:2px 0 2px 10px; border-left:3px solid #0a84ff55; color:#bbb; }
  .md-pre { background:#1c1c1c; border:1px solid #444; border-radius:4px; padding:8px;
    overflow:auto; margin:8px 0; }
  .md-code { font:11px monospace; color:#9cdcfe; }
  .md-icode { background:#1c1c1c; border-radius:3px; padding:1px 4px; font:11px monospace; color:#9cdcfe; }
  .md-strong { color:#fff; }
  .md-em { color:#ddd; }
  .md-hr { border:none; border-top:1px solid #444; margin:12px 0; }
  .pdfViewer .page { margin:8px auto; border:1px solid #444; }
  #statusbars { height: 22px; display: flex; background: #1e1e1e; color: #9cdcfe; font: 12px monospace; }
  #statusbars > div { flex: 1; padding: 0 8px; overflow: hidden; white-space: nowrap; opacity: 0.5; }
  #statusbars > div.active { opacity: 1; }
  #pdf-status { display:none; height:22px; background:#1e1e1e; color:#9cdcfe; font:12px monospace; align-items:center; padding:0 8px; }

  /* 모달 다이얼로그 다크 스타일 (프로젝트 이름 입력 / 설정) */
  dialog { background:#1e1e1e; color:#ddd; border:1px solid #555; border-radius:6px;
    padding:16px; font:13px sans-serif; }
  dialog::backdrop { background:rgba(0,0,0,0.5); }
  dialog input[type=text] { background:#222; color:#ddd; border:1px solid #555; border-radius:4px; padding:4px 6px; }
  dialog button { background:#333; color:#ddd; border:1px solid #555; border-radius:4px; padding:3px 10px; cursor:pointer; margin-left:6px; }
  dialog button:hover { background:#444; }

  /* 설정창 단축키 섹션 */
  .sc-row { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .sc-row .sc-label { flex:0 0 150px; color:#ccc; }
  .sc-row .sc-key { flex:0 0 96px; background:#222; color:#ddd; border:1px solid #555; border-radius:4px;
    padding:4px 6px; text-align:center; font:13px sans-serif; cursor:pointer; }
  .sc-row .sc-key.capturing { border-color:#0a84ff; color:#9cdcfe; }
  .sc-row .sc-warn { color:#e0a030; font-size:11px; }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="btn-open-left">Open Left</button>
    <button id="btn-open-right">Open Right</button>
    <button id="btn-mode">PDF Mode</button>
    <button id="btn-toc" title="목차 패널 열기/닫기">TOC</button>
    <button id="btn-dict" title="선택한 영어를 실시간으로 한국어로 번역(사전/엔진)">Dict: OFF</button>
    <span id="diff-controls">
      <button id="btn-save">Save</button>
      <button id="btn-prev-diff">◀ Diff</button>
      <button id="btn-next-diff">Diff ▶</button>
      <button id="btn-ws">Whitespace</button>
      <button id="btn-vim">Vim</button>
    </span>
    <span id="pdf-controls" style="display:none">
      <button id="btn-back" title="뒤로 (⌘←, 마우스 뒤로 버튼)">◀</button>
      <button id="btn-forward" title="앞으로 (⌘→, 마우스 앞으로 버튼)">▶</button>
      <button id="btn-zoom-out">−</button>
      <button id="btn-zoom-in">+</button>
      <span>Page <input id="pdf-page" type="number" min="1" value="1" style="width:46px" /> / <span id="pdf-total">0</span></span>
      <input id="pdf-find" type="text" placeholder="찾기 (⌘F)" style="width:120px" />
      <button id="btn-find-prev" title="이전 일치 (⇧Enter)">▲</button>
      <button id="btn-find-next" title="다음 일치 (Enter)">▼</button>
      <span id="pdf-find-count"></span>
      <span id="pdf-layout">
        <button id="btn-layout-compare" title="원문 | 번역 대조">대조</button>
        <button id="btn-layout-summary" title="원문 | 논문 요약">요약</button>
        <button id="btn-layout-full" title="원문 | 번역 | 논문 요약">3분할</button>
      </span>
      <button id="btn-fit">Fit: ON</button>
      <button id="btn-sync">Sync: ON</button>
      <button id="btn-night" title="야간 모드: PDF 페이지 색 반전">Night: OFF</button>
      <button id="btn-switch">⇄ Switch</button>
      <button id="btn-translate">한국어 번역 ▶</button>
    </span>
    <button id="btn-theme">Theme</button>
    <span id="toolbar-status" style="margin-left:auto; color:#9cdcfe; font:12px monospace;"></span>
  </div>
  <div id="diff-wrap">
    <div id="md-toc-left" class="md-toc"></div>
    <div id="editor"></div>
    <div id="md-toc-right" class="md-toc"></div>
  </div>
  <div id="pdfview"></div>
  <div id="statusbars"><div id="vim-left"></div><div id="vim-right"></div></div>
  <div id="pdf-status"></div>

  <dialog id="project-name-dialog">
    <form method="dialog">
      <div style="margin-bottom:8px; color:#ddd;">프로젝트 이름</div>
      <input id="project-name-input" type="text" style="width:260px" autofocus />
      <div style="margin-top:10px; text-align:right;">
        <button value="cancel">취소</button>
        <button id="project-name-ok" value="ok">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog">
    <div style="color:#ddd; margin-bottom:10px; font-weight:bold;">설정</div>
    <div style="margin-bottom:8px;">
      <div style="color:#999; font-size:11px;">기록 보관 위치</div>
      <input id="set-storage-path" type="text" readonly style="width:300px" />
      <button id="set-storage-change">변경…</button>
    </div>
    <label style="display:block; margin:6px 0;"><input type="checkbox" id="set-archive-pdf" /> PDF를 열 때 보관 폴더에 사본 저장</label>
    <label style="display:block; margin:6px 0;"><input type="checkbox" id="set-keep-translations" /> 번역본을 보관 폴더에 저장</label>

    <div style="margin-top:12px; border-top:1px solid #444; padding-top:10px;">
      <div style="color:#999; font-size:11px; margin-bottom:6px;">토글 단축키 (변경을 누르고 원하는 키 조합을 누르세요 · Esc 취소)</div>
      <div id="shortcut-rows"></div>
    </div>

    <div style="margin-top:12px; border-top:1px solid #444; padding-top:10px;">
      <div style="color:#999; font-size:11px; margin-bottom:6px;">번역 엔진·모델 (비우면 엔진 기본값 사용)</div>
      <div style="display:flex; align-items:center; gap:6px; margin:6px 0;">
        <span style="width:70px; display:inline-block; color:#ccc;">엔진</span>
        <select id="set-translate-engine">
          <option value="agy">agy</option>
          <option value="claude">claude</option>
        </select>
      </div>
      <div style="display:flex; align-items:center; gap:6px; margin:6px 0;">
        <span style="width:70px; display:inline-block; color:#ccc;">agy 모델</span>
        <input id="set-agy-model" list="agy-model-list" placeholder="(기본값)" style="width:200px" />
        <datalist id="agy-model-list"></datalist>
        <button id="set-agy-refresh">목록 새로고침</button>
        <span id="set-agy-refresh-status" style="color:#999; font-size:11px;"></span>
      </div>
      <div style="display:flex; align-items:center; gap:6px; margin:6px 0;">
        <span style="width:70px; display:inline-block; color:#ccc;">claude 모델</span>
        <input id="set-claude-model" list="claude-model-list" placeholder="(기본값)" style="width:200px" />
        <datalist id="claude-model-list"></datalist>
      </div>
    </div>

    <div style="margin-top:10px; text-align:right;"><button id="settings-close">닫기</button></div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
